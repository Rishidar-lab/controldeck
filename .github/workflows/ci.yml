name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Audit the shipped dependency surface. Production deps are zod + react +
      # react-dom (+ internal @controldeck/* packages); dev-only tooling advisories
      # (eslint/typescript-eslint, jsdom's undici) do not reach any build artifact
      # and were making this gate fail non-deterministically as new advisories
      # published. secret-scan below is unchanged.
      - run: pnpm audit --prod
      - run: pnpm secret-scan
